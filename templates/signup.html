{% extends "base.html" %}

{% block title %}Sign Up — EduPilot AI{% endblock %}

{% block public_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: var(--color-violet-soft); color: var(--color-violet); margin-bottom: 12px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
      </div>
      <h2>Create Your Account</h2>
      <p>Start studying smarter with your personalized AI companion.</p>
    </div>

    <div id="generalError" style="display: none; background: var(--color-danger-soft); color: var(--color-danger); padding: 12px; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 18px; border: 1px solid rgba(239, 68, 68, 0.2);"></div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Maya Lin" required>
        <span class="form-error-msg" id="nameError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">College or Personal Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" required>
        <span class="form-error-msg" id="emailError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (minimum 6 characters)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        <span class="form-error-msg" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
        <span class="form-error-msg" id="confirmPasswordError"></span>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
        <span>Create Account</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--color-text-muted);">
      Already have an account? <a href="{{ url_for('login_page') }}" style="font-weight: 600; color: var(--color-violet);">Log in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  // Clear previous errors
  document.querySelectorAll('.form-error-msg').forEach(el => el.textContent = '');
  document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
  const genError = document.getElementById('generalError');
  genError.style.display = 'none';

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  let hasClientError = false;

  if (!name || name.length < 2) {
    document.getElementById('nameError').textContent = 'Please enter your full name (at least 2 characters).';
    document.getElementById('name').classList.add('error');
    hasClientError = true;
  }

  const emailRegex = /^[\w\.-]+@[\w\.-]+\.\w{2,}$/;
  if (!email || !emailRegex.test(email)) {
    document.getElementById('emailError').textContent = 'Please enter a valid email address.';
    document.getElementById('email').classList.add('error');
    hasClientError = true;
  }

  if (!password || password.length < 6) {
    document.getElementById('passwordError').textContent = 'Password must be at least 6 characters.';
    document.getElementById('password').classList.add('error');
    hasClientError = true;
  }

  if (password !== confirmPassword) {
    document.getElementById('confirmPasswordError').textContent = 'Passwords do not match.';
    document.getElementById('confirmPassword').classList.add('error');
    hasClientError = true;
  }

  if (hasClientError) return;

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>Creating Account...</span>';

  try {
    const res = await apiCall('/api/auth/signup', 'POST', {
      name,
      email,
      password,
      confirm_password: confirmPassword
    });

    showToast('Account created successfully! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = res.redirect || '/dashboard';
    }, 500);

  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>Create Account</span>';
    genError.textContent = err.message || 'Registration failed. Please check your details.';
    genError.style.display = 'block';
  }
});
</script>
{% endblock %}
